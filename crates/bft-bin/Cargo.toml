[package]
name = "bft-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Thin binary: App::new(), plugin registration, CLI."

[[bin]]
name = "open-bft"
path = "src/main.rs"

[dependencies]
# The presentation side: Bevy's own defaults, spelled out because the
# workspace entry turns them off for `bft-sim`'s sake.
bevy = { workspace = true, features = ["2d", "3d", "ui", "audio"] }
bft-assets = { workspace = true }
bft-sim = { workspace = true }
bft-game = { workspace = true }
bft-xr = { workspace = true, optional = true }
clap = { workspace = true }
anyhow = { workspace = true }

[features]
# VR over OpenXR: `play --vr` and `view --vr`. Off by default, so a shipped
# build neither compiles nor links any of it.
vr = ["dep:bft-xr"]
# Profiling: every system, schedule and render step is a span sent to the
# Tracy profiler (GUI, or `tools/profile/capture.sh` headless). Off by
# default; costs a little per span when on, so never ship with it.
profile = ["bevy/trace_tracy"]
