[package]
name = "bft-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fixed-timestep simulation: physics, vehicles, weapons, AI, missions. Headless-capable."

# No `bevy_render`, `bevy_winit`, `bevy_audio` or `bevy_ui`: a dedicated server
# must build without a GPU or a window. CI job `headless-sim` enforces it.
[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "serialize",
] }
bft-assets = { workspace = true }
# Colliders. `default-features = false` drops avian's own debug-render feature,
# which would pull `bevy_render` in and break the headless build this crate
# exists to keep possible (NFR-4). `f32`, `3d` and `parry-f32` are what the
# default set is minus that.
avian3d = { workspace = true, features = [
    "3d",
    "f32",
    "parry-f32",
] }
# The sim's only randomness. A seeded ChaCha8 stream rather than a thread RNG
# so a replay and a multiplayer client step the same sequence (DESIGN §9).
rand = { workspace = true }
rand_chacha = { workspace = true }
# `PlayerInput` and `VehicleForm` are to be replicated (DESIGN §7.7) and the tuning
# override files are RON, so the sim needs derives and a RON parser of its own.
serde = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }
# The anim VM carries the 24 presentation events' payloads through to their
# handlers untouched (`AnimOutput::value`), and the reader tables are built from the
# same JSON. Already in the tree via `bft-assets`, so this adds no build.
serde_json = { workspace = true }
# `save.ron` lives in the platform's config directory, and the mission's
# progress is the only thing the sim persists.
directories = { workspace = true }
